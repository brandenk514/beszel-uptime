version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - testing

linters:
  # Disable v2 defaults that were not intentionally part of this config
  disable:
    - errcheck       # 169 findings in pre-existing code; not in the intended linter set
    - ineffassign    # 11 findings in pre-existing code; not in the intended linter set
    - unused         # 4 findings in pre-existing code; not in the intended linter set
  enable:
    - gosec          # security patterns (TLS config, file perms, command injection, weak crypto)
    - depguard       # forbid deprecated stdlib packages (io/ioutil)
    - govet          # suspicious constructs
    - staticcheck    # correctness, performance, idiomatic issues
    - revive         # style + correctness (successor to golint)
    - unparam        # unused function parameters
    - usestdlibvars  # stdlib constants instead of magic values
    - prealloc       # slice preallocation
    - unconvert      # unnecessary type conversions
    - misspell       # spelling in comments/strings
  settings:
    gosec:
      excludes:
        # Pocketbase/DB code uses file permissions that are intentional
        - G306
      config:
        G404:
          # math/rand is fine for non-security uses (shuffling, sampling)
          blocklist:
            - math/rand
    depguard:
      rules:
        stdlib:
          deny:
            - pkg: "io/ioutil"
              desc: "use io or os packages instead (io/ioutil is deprecated)"
  exclusions:
    paths:
      - build
      - internal/site/dist
      - internal/site/node_modules
      - agent/lhm/bin

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
